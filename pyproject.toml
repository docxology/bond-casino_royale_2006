# PROJECT BOND — Casino Royale (2006) mission package, codename LE CHIFFRE
# Converts the template exemplar scaffold into a film package implementing the
# frozen bond-api MissionProvider protocol (Layer 1, THE PROTOCOL).

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casino_royale_2006"
version = "0.1.0"
license = "MIT"
description = "Casino Royale (2006) special-agent mission software: poker game-theory engine, chip-movement laundering detection, parkour mobility routing, and digitalis poison detection."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "bond-api>=0.1.0",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-PyYAML>=6.0.12",
]

[tool.uv.sources]
# The frozen protocol contract is vendored in this tree, never published to an
# index. It previously bound the sibling checkout inside the suite (and, before
# that, one machine's absolute path); the copy keeps the binding valid wherever
# this repository is cloned.
bond-api = { path = "vendor/bond-api" }

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here - it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings (the monorepo root config has no mypy_path for
# this package's src/ layout). Matches the root gates: strict-ish typing,
# explicit package bases, types-PyYAML supplied via the dev extra.
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
# Explicit src-layout: the root also holds data/ and manuscript/ directories
# that would otherwise confuse setuptools flat-layout discovery.
where = ["src"]

[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `00_preflight.py` is a conventional phase-0 name even though it is not a
# valid Python module identifier; the file is only ever executed, never imported.
"scripts/00_preflight.py" = ["N999"]
