# domain_profile.yaml — advisory research-profile overlay for LE CHIFFRE.
# Declarative validation inputs only; does not execute agents.

mission:
  film: "casino_royale_2006"
  codename: "LE CHIFFRE"
  objective: "deterministic special-agent mission software over four film set pieces"

review_gates:
  - coverage_90
  - zero_mocks
  - lineage_clean
  - ruff_mypy_clean
  - deterministic

source_policy:
  - "computed claims traced to engine modules"
  - "toxicology ranges traced to module constants (claim_ledger.yaml)"
  - "no remote data sources; local-only tree"

artifact_expectations:
  - "four pure domain cores with per-module real-data tests"
  - "one MissionProvider implementing the frozen bond-api protocol"
  - "manuscript tokens computed from live engine output"
  - "two manuscript figures under output/figures/"

benchmark_rubric_preferences:
  - "deterministic seeds over sampled reproducibility"
  - "exact enumeration where tractable, Monte-Carlo where not"
