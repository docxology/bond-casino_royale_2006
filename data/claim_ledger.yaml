# claim_ledger.yaml — source-backed numeric claims for the LE CHIFFRE mission.
# Register claims whose values are intentionally disclaimable but traceable.
# Values are mirrored into manuscript prose via {{TOKEN}}s, never duplicated.

claims:
  - claim_id: digoxin_therapeutic_range
    kind: toxicology_reference
    value: "0.5-2.0 ng/mL therapeutic digoxin"
    source: "src/casino_royale_2006/poison_detect.py (THERAPEUTIC_LOW/TOXIC_CONC)"
    source_tier: literature_reference
    freshness: static
    note: "cardiac-glycoside therapeutic index; >2.0 toxicity risk, >3.5 severe"

  - claim_id: poker_aa_vs_kk_preflop
    kind: external_oracle
    value: "81.94% heads-up preflop AA equity vs KK (81.71% wins + half of 0.46% ties), published all-in equity tables"
    source: "tests/test_poker_engine.py::test_preflop_aa_vs_kk_matches_published_equity (seeded monte_carlo_equity over all 36 suit combinations, tolerance +/-2.0 points)"
    source_tier: published_reference
    freshness: static
    note: "the one value in this package not computed by it; the hand evaluator is checked against it"

  - claim_id: structuring_band
    kind: typology_definition
    value: "transfers in [threshold/2, threshold) = structuring band"
    source: "src/casino_royale_2006/laundering_detect.py (structuring_count)"
    source_tier: algorithm_definition
    freshness: static

  - claim_id: canonical_seed
    kind: determinism
    value: "SEED = 17 for all canonical snapshots"
    source: "src/casino_royale_2006/scenarios.py (SEED)"
    source_tier: configuration
    freshness: static

  - claim_id: launderer_flagged
    kind: computed
    value: "synthetic scene flags the planted smurfer (composite score)"
    source: "src/casino_royale_2006/scenarios.py::laundering_snapshot -> laundering_detect.detect on synthetic_flow(SEED)"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: cfr_toy_regret
    kind: computed
    value: "river toy game CFR converges to tiny average regret"
    source: "src/casino_royale_2006/poker_cfr.py::cfr_solve (scenarios.CFR_STRENGTHS/ITERATIONS)"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: icm_bubble_factor
    kind: computed
    value: "short-stack all-in bubble factor > 1 on the 4-player, 3-paid freezeout"
    source: "src/casino_royale_2006/icm.py::bubble_factor (scenarios.ICM_STACKS/PRIZES)"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: network_hhi_concentration
    kind: computed
    value: "launderer HHI = 1 (all counterparty flow through one account)"
    source: "src/casino_royale_2006/laundering_network.py::concentration_hhi on synthetic_flow(SEED)"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: bayes_aggressive_archetype
    kind: computed
    value: "raise-heavy history concentrates posterior on aggressive archetypes"
    source: "src/casino_royale_2006/opponent_bayes.py::posterior (scenarios.BAYES_HISTORY)"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: gadget_catalogue_size
    kind: computed
    value: "the published gadget count printed in the manuscript is derived, not written"
    source: "src/casino_royale_2006/gadgets.py (GADGET_NAMES) -> manuscript_variables NUM_GADGETS"
    source_tier: computed_regenerable
    freshness: regenerable

  - claim_id: network_named_verdict
