# experiment_plan.yaml — advisory mission experiment plan for LE CHIFFRE.
# Declarative; overlaid for validation, not executed.

mission:
  film: "casino_royale_2006"
  codename: "LE CHIFFRE"

experiments:
  - id: poker_final_hand
    concept: "Texas hold'em game theory"
    primary_metric: hero equity vs. pot-odds break-even margin
    condition: hero on fixed board vs. tight range, seeded Monte-Carlo
    baseline: break-even equity (to_call / (pot + to_call))
    expected_outputs: "equity_pct, break_even_pct, action; poker_decision.png"

  - id: poker_cfr_river_toy
    concept: "counterfactual regret minimization"
    primary_metric: average counterfactual regret at convergence
    condition: fully-enumerated river toy game, CFR_STRENGTHS strengths, CFR_ITERATIONS sweeps, no RNG
    baseline: uniform-random strategy (regret does not decay)
    expected_outputs: "avg_regret, game_value, polar value-bet/bluff/call frequencies; cfr_convergence.png"

  - id: icm_bubble_pricing
    concept: "tournament Independent Chip Model"
    primary_metric: all-in bubble factor for the short stack
    condition: ICM_STACKS/ICM_PRIZES freezeout, exact recursion (no RNG)
    baseline: heads-up bubble factor, which must equal exactly 1.0
    expected_outputs: "per-seat equities, bubble factors, call EV + decision; icm_bubble.png"

  - id: opponent_archetype_posterior
    concept: "Bayesian opponent inference"
    primary_metric: posterior mass on aggressive archetypes
    condition: BAYES_HISTORY observed actions, Dirichlet-multinomial in exact log space
    baseline: uniform archetype prior (0.5 aggressive mass)
    expected_outputs: "MAP archetype, aggressive posterior, predictive raise, expected aggression"

  - id: laundering_chip_flow
    concept: "money-laundering detection (behavioural typologies)"
    primary_metric: composite alert score for the planted launderer
    condition: synthetic scene at the canonical SEED with one smurfer
    baseline: legit players scoring below threshold
    expected_outputs: "detect() alerts; launderer flagged"

  - id: laundering_network_structure
    concept: "network-level financial crime"
    primary_metric: composite structural risk (value-neutrality x turnover share)
    condition: the same canonical chip flow, read structurally (HHI/PageRank/communities/conservation)
    baseline: the behavioural detector's verdict, which this must reach independently
    expected_outputs: "risk + HHI for the launderer, community count, top PageRank account"

  - id: parkour_extraction
    concept: "urban parkour routing"
    primary_metric: weighted route cost (fastest vs. safest)
    condition: grid=6 climbable quarter, Dijkstra vs. brute-force cross-check
    baseline: ground-level route cost
    expected_outputs: "fastest/safest costs + whether rooftops used"

  - id: digitalis_triage
    concept: "poison detection"
    primary_metric: toxicity grade + posterior of the spiked sample
    condition: tray of 5 panels, one spiked with digoxin
    baseline: therapeutic-range panels graded 'none'
    expected_outputs: "spiked index, grade, posterior; digitalis_curve.png"

determinism: "fixed SEED=17; seeded random.Random; no wall-clock in provenance"
ablation: "each concept runs independently and is cross-checked by an alternate real algorithm"
